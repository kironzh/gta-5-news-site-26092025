{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GTA 5 NEWS SITE - Eyefind Info{% endblock %}</title>
    
    <!-- Пользовательские стили -->
    {% block css %}
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

     <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0b5ed7;
            --secondary: #6c757d;
            --success: #198754;
            --info: #0dcaf0;
            --warning: #ffc107;
            --danger: #dc3545;
            --light: #f8f9fa;
            --dark: #212529;
            --gta-pink: #ff69b4;
            --gta-purple: #6f42c1;
            --gta-orange: #fd7e14;
            --gta-teal: #20c997;
            
            /* Градиенты для разных разделов */
            --gradient-media: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-food: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-money: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-travel: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --gradient-fashion: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7fc;
        }

        /* Основной контент */

        .container {
            margin-top: 2rem;
        }
        .content-wrapper {
            flex: 1;
            padding: 3rem 0;
        }

        /* Заголовки разделов */
        .section-title {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            margin-bottom: 2.5rem;
            position: relative;
            padding-bottom: 1rem;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--dark);
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* Карточки компаний */
        .company-card {
            background: white;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            position: relative;
            cursor: pointer;
        }

        .company-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .card-media {
            border-top: 4px solid #667eea;
        }
        .card-food {
            border-top: 4px solid #f5576c;
        }
        .card-money {
            border-top: 4px solid #4facfe;
        }
        .card-travel {
            border-top: 4px solid #43e97b;
        }
        .card-fashion {
            border-top: 4px solid #fa709a;
        }

        .card-img-wrapper {
            height: 180px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-wrapper i {
            font-size: 5rem;
            color: white;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            transition: all 0.5s;
        }

        .company-card:hover .card-img-wrapper i {
            transform: scale(1.1) rotate(5deg);
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            font-weight: 700;
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
            color: var(--dark);
        }

        .card-text {
            color: var(--secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .company-tags {
            margin-bottom: 1rem;
        }

        .company-tag {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            background: var(--light);
            color: var(--primary);
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: 0.3rem;
            margin-bottom: 0.3rem;
        }

        .card-footer {
            background: white;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding: 1rem 1.5rem;
        }

        .btn-card {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-card:hover {
            background: var(--primary);
            color: white;
        }

        .btn-card i {
            margin-left: 0.5rem;
            transition: transform 0.3s;
        }

        .btn-card:hover i {
            transform: translateX(3px);
        }

        /* Градиентные обертки для разделов */
        .media-bg {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecf5 100%);
        }
        .food-bg {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe9e9 100%);
        }
        .money-bg {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f3ff 100%);
        }
        .travel-bg {
            background: linear-gradient(135deg, #f0fff4 0%, #e6ffed 100%);
        }
        .fashion-bg {
            background: linear-gradient(135deg, #fff0f7 0%, #ffe6f0 100%);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .section-title {
                font-size: 2rem;
            }
            .navbar-nav .nav-link {
                padding: 0.5rem 0 !important;
            }
        }

        /* Анимации */
        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Дропдаун */
        .dropdown-menu {
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            transition: all 0.3s;
        }

        .dropdown-item:hover {
            background: var(--primary);
            color: white;
        }

        .dropdown-item i {
            width: 20px;
        }
    </style>
    {% endblock %}

    {% include 'navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <!-- Скрипты -->
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
